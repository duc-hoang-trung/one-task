name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Anon key là public theo thiết kế của Supabase; RLS bảo vệ dữ liệu. Repository variables (nếu đặt) ghi đè giá trị mặc định.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://fpnblpjltecrcglurqgf.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwbmJscGpsdGVjcmNnbHVycWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MjgzNjAsImV4cCI6MjEwNDQwNDM2MH0.yvIv5fC_Y4ZpT5Nu2XjIDhiTccSCX0lxQqElX4ATfuc' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
